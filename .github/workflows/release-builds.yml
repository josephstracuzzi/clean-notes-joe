# Builds the macOS apps (Clean Notes Joe and the Sender, each for Apple Silicon and Intel) on GitHub's runners and
# attaches them to the release. The Windows portable .exe files are still built locally.
# Runs when a release is published, or by hand for an existing tag (Actions > Release builds > Run workflow).
# The Mac apps are signed ad hoc only (no Apple Developer certificate), so macOS asks users to approve them once.
name: Release builds

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach to (for example v0.9.2)
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  mac:
    runs-on: macos-latest   # macos-14 was retired; latest always points at a supported macOS
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Check the tag matches package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if [ "v$VERSION" != "$TAG" ]; then echo "Tag $TAG does not match package.json $VERSION"; exit 1; fi

      - run: npm ci

      - run: npm test

      # Each app is built, signed, zipped and started before the next, because both are built into the same
      # dist/mac folders. This is all in the workflow (not in scripts in the repo) so it works for any tag.
      # Apple Silicon Macs refuse to run an app with no signature at all, so both get an ad hoc one.
      # The check starts the Apple Silicon app with a fresh settings folder and looks for its windows through
      # the remote debugging port.
      - name: Build, sign, zip and check both apps
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          zip_app() {
            name="$1"
            for pair in "mac-arm64:Apple Silicon" "mac:Intel"; do
              dir="${pair%%:*}"; label="${pair#*:}"
              app="dist/$dir/$name.app"
              codesign --force --deep --sign - "$app"
              codesign --verify --deep --strict "$app"
              ditto -c -k --sequesterRsrc --keepParent "$app" "dist/$name $VERSION Mac $label.zip"
            done
          }
          check_app() {
            name="$1"; title="$2"; extra="${3:-}"
            found() { grep -q "$title" pages.json && { [ -z "$extra" ] || grep -q "$extra" pages.json; }; }
            rm -f pages.json
            "dist/mac-arm64/$name.app/Contents/MacOS/$name" --remote-debugging-port=9223 &
            pid=$!
            for i in $(seq 1 40); do
              curl -s http://127.0.0.1:9223/json > pages.json || true
              if found; then break; fi
              sleep 1
            done
            cat pages.json
            kill -9 $pid || true
            sleep 2
            found
          }
          npx electron-builder --mac dir --x64 --arm64 -c.mac.identity=null
          zip_app "Clean Notes Joe"
          CNJ_PROFILE="$RUNNER_TEMP/cnj" check_app "Clean Notes Joe" "CLEAN NOTES JOE $VERSION - OPERATOR" "output.html"
          npx electron-builder --mac dir --x64 --arm64 --config electron-builder.sender.json -c.mac.identity=null
          zip_app "Clean Notes Joe Sender"
          CNJ_SENDER_PROFILE="$RUNNER_TEMP/cnj-sender" check_app "Clean Notes Joe Sender" "CLEAN NOTES JOE SENDER $VERSION"
          ls -la dist/*.zip

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/*.zip --clobber --repo "$GITHUB_REPOSITORY"
